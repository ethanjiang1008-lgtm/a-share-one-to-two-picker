name: A股首板一进二 V1 每日预测与网页发布

on:
  workflow_dispatch:
  schedule:
    - cron: "10 7 * * 1-5"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: one-to-two-v1-daily-scan
  cancel-in-progress: true

jobs:
  scan_and_deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run V1 daily scan
        run: python scripts/live_scan.py

      - name: Validate scan status
        run: |
          python - <<'PY'
          import json
          from datetime import datetime, time
          from pathlib import Path
          from zoneinfo import ZoneInfo
          from scripts.trading_calendar import is_trading_day

          p = Path("docs/data/latest.json")
          data = json.loads(p.read_text(encoding="utf-8"))
          now = datetime.now(ZoneInfo("Asia/Shanghai"))
          if is_trading_day(now.date()) and now.time() >= time(15, 5):
              status = data.get("status")
              if status not in ("ok", "no_first_board"):
                  raise SystemExit(
                      f"daily scan did not produce a valid post-close state: "
                      f"status={status}, analysis_date={data.get('analysis_date')}"
                  )
          print(
              f"validated scan status: status={data.get('status')}, "
              f"analysis_date={data.get('analysis_date')}, "
              f"prediction_date={data.get('prediction_date')}"
          )
          PY

      - name: Validate runtime data date alignment
        run: |
          python - <<'PY'
          import json
          from datetime import datetime, time
          from pathlib import Path
          from zoneinfo import ZoneInfo
          from scripts.trading_calendar import is_trading_day, previous_trading_day

          p = Path("docs/data/latest.json")
          if not p.exists():
              raise SystemExit("latest.json not produced")
          data = json.loads(p.read_text(encoding="utf-8"))
          now = datetime.now(ZoneInfo("Asia/Shanghai"))
          today = now.date()
          if is_trading_day(today):
              if now.time() < time(9, 25):
                  expected = previous_trading_day(today).isoformat()
              else:
                  expected = today.isoformat()
          else:
              expected = previous_trading_day(today).isoformat()
          analysis_date = data.get("analysis_date")
          if analysis_date != expected:
              raise SystemExit(
                  f"analysis date mismatch: runtime={now.isoformat()}, expected={expected}, got={analysis_date}"
              )
          print(
              f"validated runtime alignment: mode={data.get('market_data_mode')}, "
              f"analysis_date={analysis_date}, prediction_date={data.get('prediction_date')}"
          )

      - name: Validate daily result universe
        run: |
          python - <<'PY'
          import csv, json
          from pathlib import Path
          latest_json=Path("docs/data/latest.json")
          data=json.loads(latest_json.read_text(encoding="utf-8"))
          if data.get("status") in ("pre_open","no_first_board"):
              print(f"no current first-board rows to validate: status={data.get('status')}, mode={data.get('market_data_mode')}")
              raise SystemExit(0)
          files=sorted(Path("reports/daily").glob("*_one_to_two_v1.csv"))
          if not files:
              raise SystemExit("no daily CSV report produced for a successful scan")
          latest=files[-1]
          with latest.open(encoding="utf-8-sig", newline="") as f:
              rows=list(csv.DictReader(f))
          bad=[r for r in rows if str(r.get("name","")).strip().upper().startswith(("ST","*ST","S*ST","SST"))]
          if bad:
              raise SystemExit("ST variants found in daily result: "+", ".join(r["code"] for r in bad[:10]))
          print(f"validated {len(rows)} main-board first-board rows from {latest}")

      - name: Build web data
        run: python scripts/build_web.py

      - name: Validate previous prediction TopK
        run: python scripts/evaluate_topk.py

      - name: Build Excel review workbook
        run: python scripts/build_excel.py

      - name: Commit prediction, state, evaluation and Excel
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f reports/daily reports/evaluation reports/excel data/state/market_state.json docs/data/latest.json docs/downloads/latest.xlsx
          git diff --cached --quiet || git commit -m "data: daily one-to-two V1 scan and web result"
          git push

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: "./docs"

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
