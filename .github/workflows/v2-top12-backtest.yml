name: V2 Top1 Top2 historical backtest

on:
  workflow_dispatch:
  push:
    branches: [v2-top12-20260921]
    paths:
      - "scripts/v2_backtest_top12.py"
      - ".github/workflows/v2-top12-backtest.yml"
      - "config/model_v1.json"

permissions:
  contents: write

concurrency:
  group: v2-top12-backtest
  cancel-in-progress: false

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v2-top12-20260921
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install research dependency
        run: python -m pip install --upgrade pip numpy
      - name: Run V2 historical backtest
        run: python scripts/v2_backtest_top12.py
      - name: Upload V2 results
        uses: actions/upload-artifact@v4
        with:
          name: v2-top12-backtest
          path: |
            reports/v2_top12_backtest.json
            reports/v2_top12_backtest.csv
            config/model_v2.json
      - name: Save V2 result files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f reports/v2_top12_backtest.json reports/v2_top12_backtest.csv config/model_v2.json
          git diff --cached --quiet || git commit -m "data: V2 Top1 Top2 historical backtest"
          git push origin v2-top12-20260921
