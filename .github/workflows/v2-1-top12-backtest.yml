name: V2.1 Top1 Top2 structural backtest

on:
  workflow_dispatch:
  push:
    branches: [v2.1-top12-20260921]
    paths:
      - ".github/workflows/v2-1-top12-backtest.yml"
      - "scripts/v2_1_backtest_top12.py"

permissions:
  contents: read

concurrency:
  group: v2-1-top12-backtest
  cancel-in-progress: true

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v2.1-top12-20260921

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install research dependencies
        run: python -m pip install --upgrade pip numpy scikit-learn

      - name: Run V2.1 Top1 Top2 backtest
        run: python scripts/v2_1_backtest_top12.py

      - name: Upload V2.1 results
        uses: actions/upload-artifact@v4
        with:
          name: v2-1-top12-results
          path: |
            reports/v2_1/v2_1_top12_backtest.json
            reports/v2_1/v2_1_top12_backtest.csv
            config/model_v2_1.json
