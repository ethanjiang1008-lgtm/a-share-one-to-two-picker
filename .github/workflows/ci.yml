name: V1 code validation

on:
  push:
    branches: [main]
    paths:
      - "scripts/**"
      - "config/**"
      - ".github/workflows/**"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Validate Python and model
        run: |
          python -m py_compile scripts/market_data_sina.py scripts/live_scan.py scripts/news_reason.py scripts/build_web.py scripts/trading_calendar.py
          python -c "import json; [json.load(open(p, encoding='utf-8')) for p in ['config/model_v1.json','config/trading_calendar.json']]; print('config json ok')"
          python scripts/smoke_test.py