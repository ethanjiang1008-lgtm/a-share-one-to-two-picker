name: V1 recent six-month historical backtest

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run recent six-month backtest
        run: python scripts/backtest_recent_six_months.py
      - name: Upload backtest results
        uses: actions/upload-artifact@v4
        with:
          name: recent-six-months-one-to-two
          path: |
            reports/backtest_recent_six_months.json
            reports/backtest_recent_six_months.csv
      - name: Save result files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f reports/backtest_recent_six_months.json reports/backtest_recent_six_months.csv
          git diff --cached --quiet || git commit -m "data: recent six-month V1 backtest"
          git push
